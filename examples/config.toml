# Example hird configuration.
#
# Copy to ${XDG_CONFIG_HOME:-~/.config}/hird/config.toml. Every key is
# optional; anything left out uses the default shown here.

# How long a claim survives without a `task_update`, in minutes.
#
# Agents are told this value during the MCP handshake and asked to check in at
# half the interval, so raising it is all that is needed to give slow tasks more
# room. If an agent dies, its claim lapses after this long and the task returns
# to `open` on its own.
lease_ttl_minutes = 15

# Whether `task_list`, `mem_search` and `hird ls` span every project by default
# rather than just the current one.
#
# Explicit `--all-projects` / `all_projects: true` arguments still win, so this
# only changes what happens when nothing is specified.
all_projects_by_default = false

# What to do when a task declares files that overlap what another agent is
# already working on.
#
#   "report"  record the declaration and tell the agent who else is in there
#   "refuse"  reject the claim outright, rolling back anything it had taken
#
# "report" suits a human who is watching the board and can arbitrate; "refuse"
# suits an unattended swarm where a lost edit costs more than a stalled task.
path_conflicts = "report"

# Whether `task_next` — the tool agents call to be handed the next piece of
# work — passes over tasks whose declared file scope overlaps live work.
#
# On by default: when the queue gets to choose which task to hand out, there is
# no reason to choose one that will collide. Turn it off to have agents take
# work strictly in priority order and sort the overlaps out themselves.
dispatch_avoids_conflicts = true

# How many recalled assertions a claimed task arrives with.
#
# When a task is claimed, hird looks up what earlier agents recorded while
# working the same files — or, failing that, work that reads like this task —
# and hands those facts over unasked. Each one says why it surfaced.
#
# Keep it small: this lands in an agent's context whether or not it needed it.
# Zero turns recall off and agents go back to calling `mem_search` themselves.
recall_limit = 5

# Whether the queue watches the working tree.
#
# On, a claim records a content fingerprint of the repository and every check-in
# takes another, so `hird show` can tell you which files a task actually changed
# rather than which ones it said it would — and so a file that two agents both
# declared, and that has since moved under both of them, is reported to both as
# a contention rather than left to be discovered at merge time.
#
# Needs git, and goes quiet by itself in a project that has none. Costs nothing
# while no task in the project holds a lease: with nobody to measure, git is
# never invoked at all.
witness = true

# Whether an assertion remembers what it was learned against.
#
# On, storing a fact records the files behind it and the content hash each of
# them had at that moment. Every later reader — a search, a claim's recall, the
# memory browser — is told whether that ground has since moved, so a fact
# recorded against code that has been rewritten twice arrives marked `shaky`
# instead of arriving looking exactly like one recorded this morning.
#
# It never says a fact is false; a rename and a rewrite look the same from here.
# It says which facts are worth a re-read, which is the useful half. Confirming
# one costs nothing extra: restate it and hird re-anchors it to the tree as it
# stands and records you as another voice for it.
#
# Rides on the same working-tree access as `witness` and is off wherever that
# is; this switch is for keeping the witness while giving up the footing.
memory_footing = true
