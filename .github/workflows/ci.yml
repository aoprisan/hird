name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Spawns the real binary for the MCP and CLI integration tests, so the
      # binary has to exist before they run.
      - name: Tests
        run: cargo test --workspace --all-targets

      # The local binary must stay free of the server's web stack; that
      # separation is the whole reason `hird-server` is a second crate.
      - name: The local binary carries no web stack
        run: |
          if cargo tree -p hird -e normal | grep -qE '(^|[^-])\b(axum|hyper|tower-http)\b'; then
            echo "hird has picked up an HTTP dependency; it belongs in hird-server" >&2
            cargo tree -p hird -e normal | grep -E '(axum|hyper|tower-http)' >&2
            exit 1
          fi

      # The published site is hand-written HTML, so a renamed section id would
      # otherwise break its own table of contents silently.
      - name: Documentation site links
        run: .github/scripts/check-docs-links.sh

      # The examples are part of the documentation; a broken one misleads.
      - name: Example scripts
        env:
          HIRD_BIN: ${{ github.workspace }}/target/debug/hird
        run: |
          bash -n examples/*.sh examples/lib/*.sh examples/harness/*.sh
          ./examples/manual-dispatch.sh
          ./examples/swarm-plan.sh
          ./examples/dispatch-hook.sh
          ./examples/events.sh

      # install.sh is exercised end to end by tests/install_script.rs, but
      # get.sh downloads from a live release, so a syntax pass and shellcheck
      # are what CI can honestly check it with.
      - name: Installer scripts
        run: |
          bash -n scripts/install.sh
          sh -n scripts/get.sh
          shellcheck scripts/install.sh scripts/get.sh

      # The herdr plugin has no build step, so nothing else would catch a
      # syntax error in it before somebody's pane opens on one. Checked as
      # POSIX sh, which is what the manifest asks herdr to run them with;
      # --source-path lets it follow the `. lib.sh` both entry points do.
      - name: herdr plugin scripts
        run: |
          sh -n herdr-plugin/*.sh
          shellcheck --shell=sh --source-path=SCRIPTDIR \
            herdr-plugin/*.sh .github/scripts/check-herdr-plugin.sh
          .github/scripts/check-herdr-plugin.sh
