[package]
name = "hird"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Cross-harness agent work queue and shared assertion memory, backed by one local SQLite database"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aoprisan/hird"
readme = "README.md"
keywords = ["mcp", "agent", "queue", "sqlite", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# crossterm is consumed through `ratatui::crossterm` so the versions cannot skew.
ratatui = "0.30"
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.39", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` so merging into somebody's existing MCP config rewrites
# their file without also sorting every key in it.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "io-std", "signal"] }
toml = "0.9"
ulid = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
